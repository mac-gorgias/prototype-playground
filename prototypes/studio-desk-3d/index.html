<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EFE9E1">
  <meta name="description" content="A technique study of a procedural 3D desk in a soft-focus apartment: smooth click-to-focus, ambient idle motion, and a lamp that turns the room to evening.">
  <meta name="robots" content="noindex, nofollow">
  <title>A Quiet Desk — 3D technique study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    // Same probe as the source: can this device draw the desk at a usable speed? Software-only WebGL gets the static desk.
    (function () {
      var gl = false;
      try {
        var canvas = document.createElement('canvas');
        var opts = { failIfMajorPerformanceCaveat: true };
        var ctx = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts);
        if (ctx) {
          gl = true;
          var lose = ctx.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        }
      } catch (e) {}
      window.__deskGL = gl;
    })();
  </script>

  <style>
    :root {
      --accent: #683FCF;
      --ink: #2B2622;
      --ink-2: #6E655C;
      --ink-3: #9A9087;
      --font: 'Inter', system-ui, sans-serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
      --bleed: 48px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: #EFE9E1;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .room {
      position: relative;
      height: 100vh;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      isolation: isolate;
    }
    .bg { position: absolute; inset: 0; z-index: -1; transition: opacity .9s var(--ease); }
    .bg-day { background: radial-gradient(120% 90% at 50% 45%, #F6F1EA 0%, #ECE5DB 55%, #E2D9CC 100%); }
    .bg-evening {
      background: radial-gradient(75% 65% at 40% 55%, #6B5442 0%, #47392F 36%, #2E2620 70%, #221C18 100%);
      opacity: 0;
    }
    .is-evening .bg-evening { opacity: 1; }

    /* The apartment: its own canvas, drawn with the desk's camera, then blurred like a shallow depth of field.
       It bleeds past the viewport so the blur never pulls in a soft edge. */
    #backdrop {
      position: absolute;
      inset: calc(var(--bleed) * -1);
      opacity: 0;
      transition: opacity 1.1s var(--ease);
      pointer-events: none;
    }
    #backdrop.is-ready { opacity: 1; }
    #backdrop canvas { display: block; width: 100%; height: 100%; }

    #stage {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.1s var(--ease);
      touch-action: manipulation;
    }
    #stage.is-ready { opacity: 1; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    .intro {
      position: absolute;
      inset: 0 0 auto;
      padding: calc(2.75rem + 64px + env(safe-area-inset-top)) 24px 0;
      text-align: center;
      pointer-events: none;
      transition: opacity .5s var(--ease), transform .6s var(--ease);
    }
    .intro h1 {
      margin: 0;
      font-size: clamp(36px, 4.4vw, 64px);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.03em;
      transition: color .7s;
    }
    .intro p {
      max-width: 34rem;
      margin: 12px auto 0;
      font-size: clamp(15px, 1.25vw, 18px);
      line-height: 1.5;
      color: var(--ink-2);
      transition: color .7s;
    }
    .is-evening .intro h1 { color: #F3E9DA; }
    .is-evening .intro p { color: #CDBBA5; }
    .is-focused .intro { opacity: 0; transform: translateY(-10px); }

    /* Hover tag that follows the object under the pointer */
    .tag {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 3;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 252, 247, .94);
      border: 1px solid rgba(0, 0, 0, .08);
      box-shadow: 0 2px 20px rgba(0, 0, 0, .06);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 10px));
      opacity: 0;
      transition: opacity .18s;
    }
    .tag.is-on { opacity: 1; }
    .tag span { color: var(--ink-3); font-weight: 400; }
    .is-evening .tag { background: rgba(40, 33, 28, .9); border-color: rgba(255, 240, 220, .12); color: #F3E9DA; }
    .is-evening .tag span { color: #B9A792; }

    /* Caption shown while an object is focused */
    .caption {
      position: absolute;
      left: 24px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 4;
      width: min(340px, calc(100% - 48px));
      padding: 16px 18px;
      border-radius: 12px;
      background: rgba(255, 252, 247, .95);
      border: 1px solid rgba(0, 0, 0, .08);
      box-shadow: 0 2px 20px rgba(0, 0, 0, .06);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .35s var(--ease), transform .45s var(--ease);
    }
    .caption.is-on { opacity: 1; transform: none; pointer-events: auto; }
    .caption .eyebrow { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); }
    .caption h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .caption p.body { margin: 6px 0 14px; font-size: 13px; line-height: 1.5; color: #5C6370; }
    .is-evening .caption { background: rgba(40, 33, 28, .92); border-color: rgba(255, 240, 220, .12); color: #F3E9DA; }
    .is-evening .caption p.body { color: #CDBBA5; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, .1);
      background: #FFFCF7;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .pill:hover { border-color: rgba(0, 0, 0, .2); }
    .is-evening .pill { background: #3A2F27; border-color: rgba(255, 240, 220, .14); color: #F3E9DA; }

    .mode {
      position: absolute;
      right: 24px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 252, 247, .8);
      border: 1px solid rgba(0, 0, 0, .08);
      backdrop-filter: blur(8px);
      transition: opacity .3s;
    }
    .mode button {
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
    }
    .mode button[aria-pressed="true"] { background: #FFFCF7; color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .1); }
    .mode button:disabled { opacity: .4; cursor: not-allowed; }
    .is-evening .mode { background: rgba(40, 33, 28, .7); border-color: rgba(255, 240, 220, .12); }
    .is-evening .mode button { color: #B9A792; }
    .is-evening .mode button[aria-pressed="true"] { background: #4A3D33; color: #F3E9DA; }
    .is-focused .mode { opacity: 0; pointer-events: none; }

    .credit {
      position: absolute;
      left: 24px;
      bottom: calc(30px + env(safe-area-inset-bottom));
      margin: 0;
      font-size: 12px;
      color: var(--ink-2);
      transition: opacity .3s, color .7s;
    }
    .is-evening .credit { color: #9C8A76; }
    .is-focused .credit { opacity: 0; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .sr-only:focus-within {
      width: auto; height: auto;
      clip: auto;
      top: 16px; left: 16px;
      z-index: 10;
      display: flex; gap: 6px; flex-wrap: wrap;
    }

    /* ---------- Static desk: an illustration with its own ambient motion ---------- */
    .static { position: absolute; inset: 0; }
    .static svg { display: block; width: 100%; height: 100%; }
    .s-drift { animation: s-drift 16s ease-in-out infinite; }
    .s-sway { animation: s-sway 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .s-steam path { animation: s-steam 3.6s ease-in infinite; opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
    .s-steam path:nth-child(2) { animation-delay: 1.2s; }
    .s-steam path:nth-child(3) { animation-delay: 2.4s; }
    .s-cursor { animation: s-cursor 9s var(--ease) infinite; }
    .s-select { animation: s-select 9s steps(1) infinite; transform-box: fill-box; transform-origin: 0 0; }
    .s-walk { animation: s-walk 34s linear infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .s-step { animation: s-step .5s ease-in-out infinite alternate; }
    .s-tail { animation: s-tail 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
    .s-night { opacity: 0; transition: opacity .9s var(--ease); }
    .is-evening .s-night { opacity: 1; }
    .s-day { transition: opacity .9s var(--ease); }
    .is-evening .s-day { opacity: 0; }
    .s-dusk { opacity: 0; transition: opacity .9s var(--ease); }
    .is-evening .s-dusk { opacity: .74; }
    .s-glow { animation: s-glow 4s ease-in-out infinite; }
    .s-bulb { fill: #E9E4DA; transition: fill .6s; }
    .is-evening .s-bulb { fill: #FFE3AE; }
    .s-screen-dark { opacity: 0; transition: opacity .4s; }
    .is-evening .s-screen-dark { opacity: 1; }
    .s-lamp-hit { cursor: pointer; }
    .s-lamp-hit:hover ~ .s-lamp .s-shade, .s-lamp-hit:focus-visible ~ .s-lamp .s-shade { fill: #3A3B3F; }
    .s-steam path { stroke: #B9B2A8; }
    .is-evening .s-steam path { stroke: #E8DCCB; }

    @keyframes s-drift { 0%, 100% { transform: translateX(-7px); } 50% { transform: translateX(7px); } }
    @keyframes s-sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes s-steam {
      0% { opacity: 0; transform: translateY(6px) scaleY(.7); }
      30% { opacity: .55; }
      100% { opacity: 0; transform: translateY(-26px) scaleY(1.15); }
    }
    @keyframes s-cursor {
      0%, 8% { transform: translate(0, 0); }
      22%, 40% { transform: translate(58px, -25px); }
      55%, 73% { transform: translate(58px, 17px); }
      88%, 100% { transform: translate(0, 0); }
    }
    @keyframes s-select {
      0% { transform: translate(0, 0); }
      22% { transform: translate(62px, 0) scale(.857, .46); }
      55% { transform: translate(62px, 40px) scale(.857, .46); }
      88% { transform: translate(0, 0); }
    }
    @keyframes s-walk {
      0%, 6% { transform: translateX(0) scaleX(1); }
      44% { transform: translateX(300px) scaleX(1); }
      50%, 56% { transform: translateX(300px) scaleX(-1); }
      94% { transform: translateX(0) scaleX(-1); }
      100% { transform: translateX(0) scaleX(1); }
    }
    @keyframes s-step { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
    @keyframes s-tail { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }
    @keyframes s-glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

    @media (max-width: 640px) {
      .intro { padding-top: calc(2rem + 64px + env(safe-area-inset-top)); }
      .caption { left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: calc(100% - 32px); }
      .mode { right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); }
      .credit { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .s-drift, .s-sway, .s-steam path, .s-cursor, .s-select, .s-glow, .s-walk, .s-step, .s-tail { animation: none; }
      .s-steam path { opacity: .35; }
      .intro, .caption, .bg, #stage, #backdrop { transition-duration: .01s; }
    }
  </style>
</head>
<body>
  <main id="room" class="room" data-mode="3d">
    <div class="bg bg-day" aria-hidden="true"></div>
    <div class="bg bg-evening" aria-hidden="true"></div>

    <div id="backdrop" aria-hidden="true"></div>
    <div id="stage" aria-label="A 3D desk with a laptop, sketchbook, mug, lamp and a plant, in a softly blurred apartment" role="img"></div>

    <!-- Static desk: shown without WebGL, with ?static, or from the toggle -->
    <div id="static" class="static" hidden>
      <svg viewBox="-200 -160 1300 780" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustrated desk in a softly blurred apartment, with a laptop, lamp, mug, sketchbook, a plant and two cats">
        <defs>
          <linearGradient id="s-wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#D2AC86" />
            <stop offset="1" stop-color="#C39A72" />
          </linearGradient>
          <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#C3D5E4" />
            <stop offset="1" stop-color="#F3EADC" />
          </linearGradient>
          <linearGradient id="s-sky-night" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#121A2E" />
            <stop offset="1" stop-color="#2A3656" />
          </linearGradient>
          <linearGradient id="s-beam" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFD596" stop-opacity=".55" />
            <stop offset="1" stop-color="#FFD596" stop-opacity="0" />
          </linearGradient>
          <radialGradient id="s-pool" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#FFD596" stop-opacity=".5" />
            <stop offset="1" stop-color="#FFD596" stop-opacity="0" />
          </radialGradient>
          <filter id="s-room-blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5" /></filter>
          <filter id="s-blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="10" /></filter>
        </defs>

        <!-- The apartment, out of focus. It drifts slowly against the desk, like a breathing camera. -->
        <g filter="url(#s-room-blur)">
          <g class="s-drift">
            <rect x="120" y="-200" width="660" height="485" fill="#E9E2D6" />
            <path d="M120 -200 V285 L-260 560 V-200 Z" fill="#E1D9CB" />
            <path d="M780 -200 V285 L1160 560 V-200 Z" fill="#E5DDD0" />
            <path d="M120 285 H780 L1160 560 V660 H-260 V560 Z" fill="#6B4A35" />
            <g stroke="#4E3526" stroke-width="2" opacity=".7">
              <path d="M202 285 L-40 660" /><path d="M285 285 L170 660" /><path d="M367 285 L340 660" />
              <path d="M450 285 L450 660" /><path d="M532 285 L560 660" /><path d="M615 285 L730 660" /><path d="M697 285 L940 660" />
            </g>
            <rect x="120" y="275" width="660" height="10" fill="#F2EDE5" />

            <!-- door -->
            <rect x="170" y="20" width="120" height="265" fill="#EFE9DF" />
            <rect x="178" y="28" width="104" height="257" fill="#D9D0C2" />
            <rect x="190" y="44" width="80" height="90" fill="none" stroke="#CBC1B1" stroke-width="3" />
            <rect x="190" y="150" width="80" height="115" fill="none" stroke="#CBC1B1" stroke-width="3" />
            <circle cx="270" cy="160" r="6" fill="#B8955A" />

            <!-- shelves -->
            <g>
              <rect x="476" y="84" width="10" height="34" fill="#7E9A84" />
              <rect x="488" y="78" width="12" height="40" fill="#C27A5A" />
              <rect x="502" y="88" width="9" height="30" fill="#E8E1D3" />
              <rect x="513" y="82" width="11" height="36" fill="#5E6B7A" />
              <rect x="540" y="90" width="10" height="28" fill="#D9B25F" transform="rotate(12 545 118)" />
              <rect x="610" y="80" width="12" height="38" fill="#3E4A43" />
              <rect x="624" y="86" width="10" height="32" fill="#683FCF" />
              <rect x="636" y="82" width="11" height="36" fill="#E8E1D3" />
              <path d="M672 118 l4 -18 h18 l4 18 Z" fill="#D9D1C4" />
              <path d="M680 100 l5 -20 l4 20 Z M686 100 l8 -16 l1 16 Z" fill="#6E8F68" />
              <rect x="466" y="118" width="246" height="7" fill="#7A5A40" />
              <circle cx="498" cy="164" r="9" fill="#C9C2B6" />
              <rect x="494" y="172" width="8" height="8" fill="#B5AC9E" />
              <rect x="540" y="142" width="12" height="38" fill="#5E6B7A" />
              <rect x="554" y="148" width="10" height="32" fill="#D9B25F" />
              <rect x="566" y="144" width="12" height="36" fill="#7E9A84" />
              <rect x="640" y="150" width="11" height="30" fill="#C27A5A" />
              <rect x="653" y="146" width="12" height="34" fill="#E8E1D3" />
              <rect x="466" y="180" width="246" height="7" fill="#7A5A40" />
            </g>

            <!-- art on the left wall -->
            <path d="M-10 30 L70 56 V196 L-10 206 Z" fill="#F6F1E9" />
            <circle cx="28" cy="110" r="20" fill="#7E9A84" opacity=".85" />
            <path d="M18 150 L60 140 V176 L18 182 Z" fill="#C27A5A" opacity=".8" />

            <!-- window on the right wall -->
            <g>
              <path d="M836 20 L972 -26 V318 L836 246 Z" fill="#F4F0E8" />
              <path d="M846 34 L962 -6 V300 L846 234 Z" fill="url(#s-sky)" />
              <path class="s-night" d="M846 34 L962 -6 V300 L846 234 Z" fill="url(#s-sky-night)" />
              <g class="s-night" fill="#F5C779">
                <rect x="870" y="190" width="5" height="7" /><rect x="884" y="200" width="5" height="7" /><rect x="930" y="214" width="5" height="7" />
              </g>
              <path d="M904 14 V266" stroke="#F4F0E8" stroke-width="7" />
              <path d="M846 132 L962 118" stroke="#F4F0E8" stroke-width="7" />
              <path d="M830 246 L978 322 L978 334 L828 254 Z" fill="#EDE6DA" />
              <path class="s-day" d="M820 300 L1060 360 L930 470 L680 400 Z" fill="#FFF6E3" opacity=".35" />
            </g>

            <!-- rug under the desk -->
            <path d="M-20 470 H920 L1040 640 H-140 Z" fill="#E0D6C6" />
            <path d="M6 486 H894 L996 628 H-96 Z" fill="none" stroke="#CDBDA5" stroke-width="4" />

            <!-- cats -->
            <g transform="translate(250 285)">
              <g class="s-walk">
                <g class="s-step" fill="#1C1B1D">
                  <ellipse cx="0" cy="-27" rx="30" ry="11" />
                  <circle cx="31" cy="-37" r="10" />
                  <path d="M25 -44 L27 -55 L32 -45 Z M32 -45 L38 -54 L39 -42 Z" />
                  <rect x="-24" y="-20" width="5" height="20" rx="2" /><rect x="-15" y="-20" width="5" height="20" rx="2" />
                  <rect x="13" y="-20" width="5" height="20" rx="2" /><rect x="21" y="-20" width="5" height="20" rx="2" />
                  <path d="M-28 -30 q-16 -6 -12 -28" stroke="#1C1B1D" stroke-width="5" fill="none" stroke-linecap="round" />
                </g>
              </g>
            </g>
            <g transform="translate(700 285)" fill="#1C1B1D">
              <ellipse cx="0" cy="-20" rx="18" ry="22" />
              <circle cx="2" cy="-50" r="11" />
              <path d="M-6 -57 L-5 -69 L1 -59 Z M4 -59 L10 -69 L11 -56 Z" />
              <g class="s-tail"><path d="M14 -4 q22 2 22 -18" stroke="#1C1B1D" stroke-width="5" fill="none" stroke-linecap="round" /></g>
            </g>
          </g>

          <!-- evening: the room falls into shadow, the lamp warms the wall -->
          <rect class="s-dusk" x="-260" y="-200" width="1420" height="860" fill="#1B1511" />
          <ellipse class="s-night" cx="320" cy="210" rx="300" ry="190" fill="url(#s-pool)" />
        </g>

        <!-- the desk, in focus -->
        <g>
          <ellipse cx="450" cy="600" rx="400" ry="30" fill="#000" opacity=".12" filter="url(#s-blur)" />
          <!-- legs + apron -->
          <path d="M196 450 H208 L205 530 H199 Z" fill="#9E7853" />
          <path d="M692 450 H704 L701 530 H695 Z" fill="#9E7853" />
          <path d="M100 450 H800 V466 H100 Z" fill="#9C7652" />
          <path d="M88 450 H106 L102 640 H92 Z" fill="#B08760" />
          <path d="M794 450 H812 L808 640 H798 Z" fill="#B08760" />
          <!-- top -->
          <path d="M180 300 H720 L820 430 V446 Q820 450 816 450 H84 Q80 450 80 446 V430 Z" fill="#A9825E" />
          <path d="M180 300 H720 L820 430 H80 Z" fill="url(#s-wood)" />
          <path d="M80 430 H820" stroke="#B8916B" stroke-width="1" />

          <!-- lamp light (evening) -->
          <g class="s-night">
            <path class="s-glow" d="M302 202 L346 198 L585 420 L250 430 Z" fill="url(#s-beam)" />
            <ellipse class="s-glow" cx="420" cy="405" rx="170" ry="34" fill="url(#s-pool)" />
          </g>

          <!-- plant (back right): low-poly, faceted -->
          <g>
            <ellipse cx="652" cy="308" rx="30" ry="6" fill="#000" opacity=".12" />
            <path d="M630 268 H674 L668 306 H636 Z" fill="#D9D1C4" />
            <path d="M652 268 H674 L668 306 H652 Z" fill="#C9C0B2" />
            <path d="M628 262 H676 V270 H628 Z" fill="#4E3D30" />

  <script>
    // Room state that both the 3D desk and the static desk share: evening (lamp on) and the view mode.
    (function () {
      var room = document.getElementById('room');
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      var LAMP_KEY = 'studio-desk:lamp';

      var hour = new Date().getHours();
      var evening = hour < 7 || hour >= 19;
      try {
        var saved = JSON.parse(localStorage.getItem(LAMP_KEY) || 'null');
        if (saved && Date.now() < saved.until) evening = saved.evening;
      } catch (e) {}

      var canDraw3D = window.__deskGL !== false;
      var mode = !canDraw3D || new URLSearchParams(location.search).has('static') ? 'static' : '3d';

      function applyEvening() {
        room.classList.toggle('is-evening', evening);
        themeMeta.content = evening ? '#2E2620' : '#EFE9E1';
      }
      function applyMode() {
        room.dataset.mode = mode;
        document.getElementById('static').hidden = mode !== 'static';
        document.getElementById('stage').hidden = mode !== '3d';
        document.getElementById('backdrop').hidden = mode !== '3d';
        document.getElementById('a11y').hidden = mode !== '3d';
        document.querySelectorAll('.mode button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
          if (b.dataset.mode === '3d' && !canDraw3D) {
            b.disabled = true;
            b.title = 'This browser can’t draw the 3D desk';
          }
        });
      }

      window.DeskUI = {
        get evening() { return evening; },
        get mode() { return mode; },
        setEvening: function (value) {
          evening = value;
          applyEvening();
          try { localStorage.setItem(LAMP_KEY, JSON.stringify({ evening: value, until: Date.now() + 12 * 3600e3 })); } catch (e) {}
          dispatchEvent(new CustomEvent('desk:evening', { detail: value }));
        },
        toggleEvening: function () { this.setEvening(!evening); },
        setMode: function (value) {
          if (value === '3d' && !canDraw3D) return;
          mode = value;
          applyMode();
          dispatchEvent(new CustomEvent('desk:mode', { detail: value }));
        },
        disable3D: function () {
          canDraw3D = false;
          this.setMode('static');
          applyMode();
        }
      };

      applyEvening();
      applyMode();

      document.querySelectorAll('.mode button').forEach(function (b) {
        b.addEventListener('click', function () { DeskUI.setMode(b.dataset.mode); });
      });
      var lampHit = document.querySelector('.s-lamp-hit');
      lampHit.addEventListener('click', function () { DeskUI.toggleEvening(); });
      lampHit.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); DeskUI.toggleEvening(); }
      });

      // If the 3D modules never arrive (offline CDN), fall back to the static desk.
      setTimeout(function () { if (!window.__deskStarted && canDraw3D) DeskUI.disable3D(); }, 9000);
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    if (window.__deskGL === false) throw new Error('No usable WebGL; static desk only.');
    window.__deskStarted = true;

    const ui = window.DeskUI;
    const room = document.getElementById('room');
    const stageEl = document.getElementById('stage');
    const backdropEl = document.getElementById('backdrop');
    const tagEl = document.getElementById('tag');
    const captionEl = document.getElementById('caption');

    const reduceQuery = matchMedia('(prefers-reduced-motion: reduce)');
    let reduceMotion = reduceQuery.matches;
    reduceQuery.addEventListener('change', (e) => { reduceMotion = e.matches; });
    const canHover = matchMedia('(hover: hover)').matches;

    // ---------------------------------------------------------------------------------------------
    // Motion helpers. smoothDamp is the critically damped spring behind maath's easing.damp3 —
    // it eases out of rest and into the target, so a click never snaps the camera.
    // ---------------------------------------------------------------------------------------------
    function smoothDamp(current, target, state, smoothTime, dt) {
      smoothTime = Math.max(0.0001, smoothTime);
      const omega = 2 / smoothTime;
      const x = omega * dt;
      const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
      const change = current - target;
      const temp = (state.v + omega * change) * dt;
      state.v = (state.v - omega * temp) * exp;
      let out = target + (change + temp) * exp;
      if ((target - current > 0) === (out > target)) { out = target; state.v = 0; }
      return out;
    }
    class Damp1 {
      constructor(v = 0) { this.value = v; this.s = { v: 0 }; }
      step(target, smoothTime, dt) { return (this.value = smoothDamp(this.value, target, this.s, smoothTime, dt)); }
    }
    class Damp3 {
      constructor(v) { this.value = v.clone(); this.sx = { v: 0 }; this.sy = { v: 0 }; this.sz = { v: 0 }; }
      step(t, smoothTime, dt) {
        const v = this.value;
        v.set(
          smoothDamp(v.x, t.x, this.sx, smoothTime, dt),
          smoothDamp(v.y, t.y, this.sy, smoothTime, dt),
          smoothDamp(v.z, t.z, this.sz, smoothTime, dt)
        );
        return v;
      }
      jump(t) { this.value.copy(t); this.sx.v = this.sy.v = this.sz.v = 0; }
    }
    // A small spring for "boing" reactions (plant nudge, lamp nod).
    class Spring {
      constructor(k = 70, c = 5) { this.k = k; this.c = c; this.x = 0; this.v = 0; }
      kick(v) { this.v += v; }
      step(dt) {
        const n = Math.ceil(dt / (1 / 120));
        const h = dt / n;
        for (let i = 0; i < n; i++) { this.v += (-this.k * this.x - this.c * this.v) * h; this.x += this.v * h; }
        return this.x;
      }
    }
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp01 = (t) => Math.min(1, Math.max(0, t));
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    // Seeded random so procedural textures are the same on every load.
    function rng(seed) {
      return () => {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ---------------------------------------------------------------------------------------------
    // Two renderers share one camera: the desk (sharp, transparent) over the apartment (blurred).
    // ---------------------------------------------------------------------------------------------
    function makeRenderer(el, opts) {
      const r = new THREE.WebGLRenderer({ powerPreference: 'high-performance', ...opts });
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.toneMappingExposure = 1.0;
      el.appendChild(r.domElement);
      return r;
    }
    const renderer = makeRenderer(stageEl, { antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // The room is blurred anyway, so it renders at half resolution.
    const roomRenderer = makeRenderer(backdropEl, { antialias: false, alpha: false });
    roomRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * 0.5);
    const BLEED = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bleed')) || 48;

    const scene = new THREE.Scene();
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.75;
    const roomScene = new THREE.Scene();
    roomScene.environment = new THREE.PMREMGenerator(roomRenderer).fromScene(new RoomEnvironment(), 0.04).texture;
    roomScene.environmentIntensity = 0.35;
    roomScene.background = new THREE.Color(0xe9e2d6);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.02, 30);
    const roomCamera = new THREE.PerspectiveCamera(42, 1, 0.05, 30);

    const hemi = new THREE.HemisphereLight(0xfff6ea, 0xd9c7ae, 0.7);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffecd8, 2.3);
    key.position.set(1.0, 2.6, 1.6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    Object.assign(key.shadow.camera, { left: -0.9, right: 0.9, top: 0.9, bottom: -0.9, near: 0.5, far: 6 });
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.015;
    scene.add(key);
    const dayKeyColor = new THREE.Color(0xffecd8);
    const nightKeyColor = new THREE.Color(0x9db0d8);

    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    function canvasTexture(w, h, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      const api = { tex, ctx, w, h, draw(fn = draw) { fn(ctx, w, h); tex.needsUpdate = true; } };
      api.draw();
      return api;
    }
    const shadowed = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
    const mesh = (geo, mat) => shadowed(new THREE.Mesh(geo, mat));
    const radialBlob = (stops) => canvasTexture(256, 256, (g, w, h) => {
      const grad = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      stops.forEach(([at, c]) => grad.addColorStop(at, c));
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
    });

    // Everything on and under the desk lives in one rig (the note re-parents to it when it falls).
    const rig = new THREE.Group();
    scene.add(rig);

    // ---------------------------------------------------------------------------------------------
    // Desk: top, apron, and four tapered legs down to the apartment floor
    // ---------------------------------------------------------------------------------------------
    const DESK_W = 1.3, DESK_D = 0.7, TOP_T = 0.045, FLOOR = -0.74;
    const wood = canvasTexture(1024, 512, (g, w, h) => {
      const r = rng(7);
      g.fillStyle = '#C9A07A';
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 220; i++) {
        const y = r() * h;
        const tone = 110 + r() * 40;
        g.strokeStyle = `rgba(${tone | 0}, ${(tone * 0.68) | 0}, ${(tone * 0.42) | 0}, ${0.03 + r() * 0.08})`;
        g.lineWidth = 0.5 + r() * 2.6;
        g.beginPath();
        for (let x = 0; x <= w; x += 16) {
          const yy = y + Math.sin(x * 0.004 + i) * 6 + Math.sin(x * 0.013 + i * 1.7) * 2;
          x ? g.lineTo(x, yy) : g.moveTo(x, yy);
        }
        g.stroke();
      }
    });
    const desk = mesh(
      new RoundedBoxGeometry(DESK_W, TOP_T, DESK_D, 4, 0.012),
      new THREE.MeshStandardMaterial({ map: wood.tex, roughness: 0.62 })
    );
    desk.position.y = -TOP_T / 2;
    rig.add(desk);

    const frameWood = new THREE.MeshStandardMaterial({ color: 0xb48b63, roughness: 0.6 });
    const LEG_X = DESK_W / 2 - 0.07, LEG_Z = DESK_D / 2 - 0.06, LEG_H = -TOP_T - FLOOR;
    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => {
      const leg = mesh(new THREE.CylinderGeometry(0.021, 0.014, LEG_H, 16), frameWood);
      leg.position.set(sx * LEG_X, -TOP_T - LEG_H / 2, sz * LEG_Z);
      rig.add(leg);
    });
    const apronFront = mesh(new THREE.BoxGeometry(2 * LEG_X, 0.06, 0.018), frameWood);
    [-1, 1].forEach((s) => {
      const a = apronFront.clone();
      a.position.set(0, -TOP_T - 0.03, s * LEG_Z);
      rig.add(a);
      const side = mesh(new THREE.BoxGeometry(0.018, 0.06, 2 * LEG_Z), frameWood);
      side.position.set(s * LEG_X, -TOP_T - 0.03, 0);
      rig.add(side);
    });

    // ---------------------------------------------------------------------------------------------
    // Item registry: every clickable thing has a group, an invisible hit box, an anchor for its label
    // and (optionally) a camera focus pose.
    // ---------------------------------------------------------------------------------------------
    const items = new Map();
    const proxies = [];
    const proxyMat = new THREE.MeshBasicMaterial();
    function addItem(key, cfg) {
      const it = { key, lift: new Damp1(0), baseY: cfg.group.position.y, ...cfg };
      if (cfg.proxySize) {
        const proxy = new THREE.Mesh(new THREE.BoxGeometry(...cfg.proxySize), proxyMat);
        proxy.position.fromArray(cfg.proxyAt || [0, cfg.proxySize[1] / 2, 0]);
        proxy.visible = false;
        cfg.group.add(proxy);
        it.proxy = proxy;
      }
      it.proxy.userData.item = it;
      proxies.push(it.proxy);
      items.set(key, it);
      return it;
    }

    // ---------------------------------------------------------------------------------------------
    // Laptop — the screen is a canvas redrawn ~20×/s: a small design tool with a wandering cursor.
    // Its appearance follows the lamp: light by day, dark in the evening.
    // ---------------------------------------------------------------------------------------------
    const alu = new THREE.MeshPhysicalMaterial({ color: 0xd4d6da, metalness: 0.55, roughness: 0.32, clearcoat: 0.2 });
    const laptop = new THREE.Group();
    laptop.position.set(-0.06, 0, -0.05);
    laptop.rotation.y = 0.08;
    rig.add(laptop);

    const base = mesh(new RoundedBoxGeometry(0.32, 0.012, 0.22, 3, 0.004), alu);
    base.position.y = 0.006;
    laptop.add(base);

    const keyboard = canvasTexture(1024, 704, (g, w, h) => {
      g.fillStyle = '#D4D6DA';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#26272A';
      const cols = [14, 14, 13, 12, 11];
      const kx = 70, kw = w - 140, top = 50, rowH = 52;
      cols.forEach((n, row) => {
        const gap = 7, size = (kw - gap * (n - 1)) / n;
        for (let i = 0; i < n; i++) g.beginPath(), g.roundRect(kx + i * (size + gap), top + row * (rowH + 7), size, rowH, 6), g.fill();
      });
      const y = top + 5 * (rowH + 7);
      [[kx, 100], [kx + 107, 100], [kx + 214, 456], [kx + 677, 100], [kx + 784, 100]].forEach(([x, wd]) => {
        g.beginPath(); g.roundRect(x, y, wd, rowH, 6); g.fill();
      });
      g.fillStyle = '#CBCDD2';
      g.strokeStyle = 'rgba(0,0,0,0.08)';
      g.lineWidth = 2;
      g.beginPath(); g.roundRect(w / 2 - 170, 420, 340, 250, 14); g.fill(); g.stroke();
    });
    const kbPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(0.304, 0.209),

      model.position.set(-c.x, -box.min.y, -c.z);

    // ---------------------------------------------------------------------------------------------
    // The apartment (its own scene, drawn on the blurred backdrop canvas)

    const SIDE = 1.9, BACK = -3.2, FRONT = 5, CEIL = 1.9;

    });
    planks.tex.wrapS = planks.tex.wrapT = THREE.RepeatWrapping;

    const floor = add(apartment, new THREE.PlaneGeometry(2 * SIDE, FRONT - BACK), new THREE.MeshStandardMaterial({ map: planks.tex, roughness: 0.55 }), 0, FLOOR, (FRONT + BACK) / 2);

    add(apartment, new THREE.PlaneGeometry(2 * SIDE, WALL_H), wallMat, 0, FLOOR + WALL_H / 2, BACK);

    // Outside: a day and a night view, cross-faded with the lamp
    const winW = WIN.z1 - WIN.z0, winH = WIN.y1 - WIN.y0, winZ = (WIN.z0 + WIN.z1) / 2, winY = (WIN.y0 + WIN.y1) / 2;

    const glassGeo = new THREE.PlaneGeometry(winW, winH);

    const rugTex = canvasTexture(512, 384, (g, w, h) => {

    const rug = add(apartment, new THREE.PlaneGeometry(2.2, 1.6), new THREE.MeshStandardMaterial({ map: rugTex.tex, roughness: 1 }), 0, FLOOR + 0.002, 0);
    rug.rotation.x = -Math.PI / 2;
    const shadowTex = radialBlob([[0, 'rgba(0,0,0,0.55)'], [0.6, 'rgba(0,0,0,0.2)'], [1, 'rgba(0,0,0,0)']]);
    const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex.tex, transparent: true, depthWrite: false, opacity: 0.4 });
    const deskShadow = add(apartment, new THREE.PlaneGeometry(1.7, 1.0), shadowMat, 0, FLOOR + 0.004, 0);

    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => {

    // Cats — two black cats along the back wall: one strolls and pauses, one sits and swishes its tail.
    const catMat = new THREE.MeshStandardMaterial({ color: 0x1c1b1e, roughness: 0.55 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2a2a1a, emissive: 0xd8e36a, emissiveIntensity: 0 });
    const catPart = (geo, x, y, z, parent) => add(parent, geo, catMat, x, y, z);
    function catHead(parent, x, y) {

    function catTail(parent, x, y, z, n, len) {
      const segs = [];
      const geo = new THREE.CapsuleGeometry(0.013, len, 4, 8);
      let p = parent;
      for (let i = 0; i < n; i++) {
        const s = new THREE.Group();
        if (i === 0) s.position.set(x, y, z); else s.position.y = len;
        p.add(s);
        catPart(geo, 0, len / 2, 0, s);
        segs.push(s);
        p = s;
      }
      return segs;
    }
    const catShadow = (parent, sx, sz) => {
      const s = add(parent, new THREE.PlaneGeometry(sx, sz), shadowMat, 0, 0.003, 0);
      s.rotation.x = -Math.PI / 2;
    };

    const CAT_WALL_Z = -2.8, CAT_TURN_R = 0.14;
    const walker = (() => {
      const root = new THREE.Group();
      root.position.set(-0.6, FLOOR, CAT_WALL_Z);
      apartment.add(root);
      catShadow(root, 0.5, 0.2);
      const body = new THREE.Group();
      root.add(body);
      catPart(new THREE.CapsuleGeometry(0.07, 0.22, 6, 14), 0, 0.2, 0, body).rotation.z = Math.PI / 2;
      const h = catHead(body, 0.2, 0.29);
      const legs = [[0.11, 1, 0], [0.11, -1, Math.PI], [-0.11, 1, Math.PI], [-0.11, -1, 0]].map(([x, s, phase]) => {
        const hip = new THREE.Group();
        hip.position.set(x, 0.19, s * 0.04);
        hip.userData.phase = phase;
        body.add(hip);
        catPart(new THREE.CapsuleGeometry(0.018, 0.13, 4, 8), 0, -0.09, 0, hip);
        return hip;
      });
      const tail = catTail(body, -0.17, 0.22, 0, 7, 0.04);
      tail[0].rotation.z = 0.7;
      tail.slice(1).forEach((s) => { s.rotation.z = -0.18; });
      return {
        root, body, head: h, legs, tail, x: -0.6, z: CAT_WALL_Z, zs: { v: 0 }, dir: 1, target: 0.7, state: 'walk', timer: 0, turn: null,
        phase: 0, heading: 0, turnRate: 0, stride: new Damp1(1), look: new Damp1(0),
      };
    })();

    const sitter = (() => {
      const root = new THREE.Group();
      root.position.set(1.3, FLOOR, -2.55);
      root.rotation.y = -Math.PI / 2 + 0.35;
      apartment.add(root);
      catShadow(root, 0.32, 0.3);
      catPart(new THREE.SphereGeometry(0.09, 16, 12), -0.02, 0.085, 0, root).scale.set(1.1, 0.95, 1.1);
      catPart(new THREE.CapsuleGeometry(0.065, 0.12, 6, 12), 0.03, 0.19, 0, root).rotation.z = -0.35;
      const h = catHead(root, 0.07, 0.33);
      [-1, 1].forEach((s) => catPart(new THREE.CapsuleGeometry(0.016, 0.15, 4, 8), 0.075, 0.085, s * 0.03, root));
      const tail = catTail(root, -0.09, 0.016, 0.04, 8, 0.04);
      tail[0].rotation.x = Math.PI / 2;
      return { root, head: h, tail };
    })();

    function updateCats(t, dt) {
      const w = walker;
      const still = reduceMotion;
      if (!still) {
        if (w.state === 'walk') {
          w.x += w.dir * 0.2 * dt;
          w.z = smoothDamp(w.z, CAT_WALL_Z, w.zs, 1.6, dt);
          w.phase += dt * 7.5;
          if (w.dir > 0 ? w.x >= w.target : w.x <= w.target) { w.state = 'pause'; w.timer = 2.5 + Math.random() * 3.5; }
        } else if (w.state === 'pause') {
          w.timer -= dt;
          if (w.timer <= 0) { w.state = 'turn'; w.turn = { a: 0, cx: w.x, z0: w.z, dir: w.dir }; }
        } else {
          // U-turn: a tight arc out from the wall toward the room, stepping the whole way round,
          // then it drifts back to the wall line as it walks on.
          const tr = w.turn;
          tr.a = Math.min(Math.PI, tr.a + (0.16 / CAT_TURN_R) * dt);
          w.x = tr.cx + CAT_TURN_R * Math.sin(tr.a) * tr.dir;
          w.z = tr.z0 + CAT_TURN_R * (1 - Math.cos(tr.a));
          w.phase += dt * 6.5;
          if (tr.a >= Math.PI) {
            w.dir = -tr.dir;
            w.target = w.dir > 0 ? 0.5 + Math.random() * 0.35 : -1.35 + Math.random() * 0.5;
            w.state = 'walk';
          }
        }
      }
      // Heading follows the path it actually travels, so the body swings round like an animal walking,
      // not a model spinning on its centre.
      const dx = w.x - w.root.position.x, dz = w.z - w.root.position.z;
      if (dx * dx + dz * dz > 1e-10) {
        let heading = Math.atan2(-dz, dx);
        while (heading - w.heading > Math.PI) heading -= Math.PI * 2;
        while (heading - w.heading < -Math.PI) heading += Math.PI * 2;
        w.turnRate = (heading - w.heading) / Math.max(dt, 1e-4);
        w.heading = heading;
      } else {
        w.turnRate = 0;
      }
      w.root.position.set(w.x, FLOOR, w.z);
      w.root.rotation.y = w.heading;

      const moving = w.state !== 'pause' && !still;
      const stride = w.stride.step(moving ? 1 : 0, 0.2, dt);
      w.legs.forEach((hip) => { hip.rotation.z = Math.sin(w.phase + hip.userData.phase) * 0.5 * stride; });
      w.body.position.y = Math.abs(Math.sin(w.phase)) * 0.008 * stride;
      // It glances toward the camera when it stops, and its head leads into the turn.
      const lead = Math.max(-0.6, Math.min(0.6, w.turnRate * 0.3));
      w.head.rotation.y = w.look.step(w.state === 'pause' ? (w.dir > 0 ? -0.8 : 0.8) : lead, 0.25, dt);
      w.tail.forEach((s, i) => { s.rotation.x = still ? 0 : Math.sin(t * 2 + i * 0.5) * 0.12; });

      sitter.head.rotation.y = still ? 0 : Math.sin(t * 0.23) * 0.35 + Math.sin(t * 0.61) * 0.1;
      sitter.tail.forEach((s, i) => {
        if (i === 0) return;
        s.rotation.z = -0.28 + (still || i < 3 ? 0 : Math.sin(t * 1.6 - i * 0.6) * 0.12);
      });
    }

    // Room lights
    const roomHemi = new THREE.HemisphereLight(0xfff6ea, 0xcbb79c, 0.9);
    roomScene.add(roomHemi);
    const windowLight = new THREE.DirectionalLight(0xfff2e0, 1.4);
    windowLight.position.set(4, 1.6, -1.8);
    windowLight.target.position.set(0, FLOOR, -2.4);
    roomScene.add(windowLight, windowLight.target);
    const dayWindowColor = new THREE.Color(0xfff2e0), nightWindowColor = new THREE.Color(0x7d90c0);
    const roomLamp = new THREE.PointLight(0xffc98a, 0, 0, 1);
    roomScene.add(roomLamp);

    // ---------------------------------------------------------------------------------------------
    // Camera: the overview frames the desk's front edge at ~75% of the width, zoomed in 15% (room cropped as needed);
    // focus poses frame one object.
    // ---------------------------------------------------------------------------------------------
    let tanH = 0.5;
    const pose = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
    const ZOOM = 1.15;
    function overviewPose(out) {
      const portrait = camera.aspect < 0.9;
      const frac = portrait ? 0.92 : 0.75;
      const pitch = THREE.MathUtils.degToRad(portrait ? 13 : 15);
      // The camera sits on a ray 5° steeper than its view, so the desk lands a little below the middle of the frame.
      const elev = pitch + THREE.MathUtils.degToRad(5);
      // View depth that fits the desk's front edge to `frac` of the width, then zoomed in.
      const depth = (DESK_W / 2 / frac) / tanH / ZOOM;
      const r = (depth + (DESK_D / 2) * Math.cos(pitch)) / Math.cos(elev - pitch);
      out.pos.set(0, Math.sin(elev) * r, Math.cos(elev) * r);
      out.target.set(0, out.pos.y - Math.sin(pitch) * 3, out.pos.z - Math.cos(pitch) * 3);
      return out;
    }
    const _dir = new THREE.Vector3();
    function focusPose(it, out) {
      const f = it.focus;
      it.anchor.getWorldPosition(out.target);
      if (f.normalOf) {
        f.normalOf.getWorldQuaternion(_q);
        _dir.set(0, 0, 1).applyQuaternion(_q);
        _dir.y += f.up;
      } else {
        _dir.copy(f.dir);
      }
      _dir.normalize();
      const dist = Math.max(f.dist, (f.size / 2) / tanH * 1.1);
      out.pos.copy(out.target).addScaledVector(_dir, dist);
      return out;
    }

    let viewW = 1, viewH = 1;
    function resize() {
      viewW = stageEl.clientWidth || innerWidth;
      viewH = stageEl.clientHeight || innerHeight;
      renderer.setSize(viewW, viewH, false);
      roomRenderer.setSize(viewW + 2 * BLEED, viewH + 2 * BLEED, false);
      camera.aspect = viewW / viewH;
      camera.fov = camera.aspect < 0.9 ? 50 : 42;
      camera.updateProjectionMatrix();
      tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
    }
    resize();
    addEventListener('resize', resize);

    // The room camera is the desk camera with a wider frustum that matches the bleed.
    function syncRoomCamera() {
      roomCamera.position.copy(camera.position);
      roomCamera.quaternion.copy(camera.quaternion);
      roomCamera.fov = camera.fov;
      roomCamera.aspect = camera.aspect;
      roomCamera.setViewOffset(viewW, viewH, -BLEED, -BLEED, viewW + 2 * BLEED, viewH + 2 * BLEED);
      roomCamera.updateProjectionMatrix();
    }

    overviewPose(pose);
    // Intro: start further out and higher, then dolly in on the same damping as every other move.
    const camPos = new Damp3(pose.pos.clone().multiplyScalar(1.4).add(new THREE.Vector3(0.25, 0.25, 0)));
    const camTarget = new Damp3(pose.target);
    if (reduceMotion) camPos.jump(pose.pos);

    // ---------------------------------------------------------------------------------------------
    // Interaction
    // ---------------------------------------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const pointer = { x: 0, y: 0, inside: false };
    const parallax = { x: new Damp1(0), y: new Damp1(0) };
    let hovered = null;
    let focused = null;

    function pick(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      // The note sits inside the laptop's hit box, so test it first.
      if (raycaster.intersectObject(note, false).length) return noteItem;
      const hit = raycaster.intersectObjects(proxies, false).find((h) => h.object !== note);
      return hit ? hit.object.userData.item : null;
    }

    function setFocus(it) {
      focused = it && it.focus ? it : null;
      room.classList.toggle('is-focused', !!focused);
      const cap = focused && focused.caption;
      captionEl.classList.toggle('is-on', !!cap);
      captionEl.inert = !cap;
      if (cap) {
        captionEl.querySelector('.eyebrow').textContent = cap.eyebrow;
        captionEl.querySelector('h2').textContent = cap.title;
        captionEl.querySelector('.body').textContent = cap.body;
      }
    }
    function activate(it) {
      if (!it) { if (focused) setFocus(null); return; }
      if (it.onClick) it.onClick();
      if (it.focus) setFocus(it);
    }

    let down = null;
    renderer.domElement.addEventListener('pointermove', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
      pointer.inside = true;
      if (canHover && e.pointerType === 'mouse') hovered = pick(e.clientX, e.clientY);
    });
    renderer.domElement.addEventListener('pointerleave', () => { pointer.inside = false; hovered = null; });
    renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
      down = null;
      activate(pick(e.clientX, e.clientY));
    });
    document.getElementById('back').addEventListener('click', () => setFocus(null));
    addEventListener('keydown', (e) => { if (e.key === 'Escape' && focused) setFocus(null); });
    document.querySelectorAll('#a11y [data-item]').forEach((b) => {
      b.addEventListener('click', () => activate(items.get(b.dataset.item)));
    });

    // ---------------------------------------------------------------------------------------------
    // Frame loop
    // ---------------------------------------------------------------------------------------------
    const clock = new THREE.Clock();
    const night = new Damp1(ui.evening ? 1 : 0);
    const blur = new Damp1(7);
    let appliedBlur = -1;
    let elapsed = 0;
    let screenClock = 1;
    const _proj = new THREE.Vector3();
    const _right = new THREE.Vector3(), _up = new THREE.Vector3();
    const _drift = new THREE.Vector3();

    function frame() {
      const dt = Math.min(clock.getDelta(), 1 / 30);
      elapsed += dt;
      const t = elapsed;
      const still = reduceMotion;

      // Evening
      const n = night.step(ui.evening ? 1 : 0, still ? 0.01 : 0.35, dt);
      const flicker = 1 + (still ? 0 : Math.sin(t * 13) * 0.006 + Math.sin(t * 31.7) * 0.004);
      key.intensity = lerp(2.3, 0.16, n);
      key.color.lerpColors(dayKeyColor, nightKeyColor, n);
      hemi.intensity = lerp(0.7, 0.1, n);
      scene.environmentIntensity = lerp(0.75, 0.1, n);
      spot.intensity = lerp(0, 0.75, n) * flicker;
      glow.intensity = lerp(0, 0.12, n) * flicker;
      bulbMat.emissiveIntensity = lerp(0, 4, n);
      renderer.toneMappingExposure = lerp(1, 1.12, n);

      roomHemi.intensity = lerp(0.9, 0.05, n);
      roomScene.environmentIntensity = lerp(0.35, 0.03, n);
      windowLight.intensity = lerp(1.4, 0.12, n);
      windowLight.color.lerpColors(dayWindowColor, nightWindowColor, n);
      head.getWorldPosition(roomLamp.position);
      roomLamp.intensity = lerp(0, 1.1, n) * flicker;
      nightGlassMat.opacity = n;
      poolMat.opacity = lerp(0.35, 0, n);
      eyeMat.emissiveIntensity = lerp(0, 1.4, n);
      roomRenderer.toneMappingExposure = lerp(1, 1.15, n);

      // Hover lift
      items.forEach((it) => {
        if (it.noLift) return;
        const lift = it.lift.step(it === hovered && it !== focused ? 0.015 : 0, still ? 0.01 : 0.12, dt);
        it.group.position.y = it.baseY + lift;
      });

      // Item-specific motion
      head.rotation.z = -1.0 + lampNod.step(dt) * 0.5;
      lampSwitch.position.y = 0.0155 + Math.min(0, switchPress.step(dt)) * 0.2;
      plantSway.rotation.z = (still ? 0 : Math.sin(t * 0.8) * 0.012) + plantWobble.step(dt) * 0.6;
      plantSway.rotation.x = (still ? 0 : Math.sin(t * 0.63 + 2) * 0.008) + plantWobble.x * 0.25;
      coverPivot.rotation.z = bookOpen.step(focused === bookItem ? Math.PI + 0.085 : 0, still ? 0.01 : 0.45, dt);
      bookItem.proxy.scale.x = bookOpen.value > 0.5 ? 2 : 1;
      bookItem.proxy.position.x = bookOpen.value > 0.5 ? -BW / 2 : 0;
      updateSteam(t, n);
      updateNote(dt);
      updateCats(t, dt);

      const dark = screenDark.step(ui.evening ? 1 : 0, still ? 0.01 : 0.12, dt);
      screenClock += dt;
      if (screenClock > 1 / 20) {
        screenClock = 0;
        screenTex.draw((g, w, h) => drawScreenFrame(g, w, h, t, dark));
      }

      // Camera: damped pose + a slow "breathing" drift + pointer parallax. The drift is what keeps the
      // sharp desk sliding gently against the soft room even when nobody touches anything.
      if (focused) focusPose(focused, pose); else overviewPose(pose);
      const smooth = still ? 0.01 : 0.42;
      camPos.step(pose.pos, smooth, dt);
      camTarget.step(pose.target, smooth, dt);
      const px = parallax.x.step(pointer.inside && !still ? pointer.x : 0, 0.6, dt);
      const py = parallax.y.step(pointer.inside && !still ? pointer.y : 0, 0.6, dt);
      const pAmp = focused ? 0.012 : 0.06;
      const driftAmp = still ? 0 : focused ? 0.25 : 1;
      _drift.set(Math.sin(t * 0.19) * 0.03, Math.sin(t * 0.23 + 1) * 0.012, 0).multiplyScalar(driftAmp);
      camera.position.copy(camPos.value);
      camera.lookAt(camTarget.value);
      _right.setFromMatrixColumn(camera.matrixWorld, 0);
      _up.setFromMatrixColumn(camera.matrixWorld, 1);
      camera.position
        .addScaledVector(_right, px * pAmp + _drift.x)
        .addScaledVector(_up, -py * pAmp * 0.5 + _drift.y);
      camera.lookAt(camTarget.value);
      camera.updateMatrixWorld();
      syncRoomCamera();

      // Depth of field: the room softens a little more while you look closely at something.
      const b = blur.step(focused ? 12 : 7, still ? 0.01 : 0.5, dt);
      if (Math.abs(b - appliedBlur) > 0.05) {
        appliedBlur = b;
        backdropEl.style.filter = `blur(${b.toFixed(2)}px)`;
      }

      // Hover tag + cursor
      const showTag = hovered && hovered !== focused;
      renderer.domElement.style.cursor = hovered ? 'pointer' : (focused ? 'zoom-out' : 'default');
      if (showTag) {
        hovered.labelAnchor.getWorldPosition(_proj).project(camera);
        const [title, hint] = hovered.label();
        const html = `${title} <span>· ${hint}</span>`;
        if (tagEl.innerHTML !== html) tagEl.innerHTML = html;
        tagEl.style.left = `${(_proj.x * 0.5 + 0.5) * viewW}px`;
        tagEl.style.top = `${(-_proj.y * 0.5 + 0.5) * viewH}px`;
      }
      tagEl.classList.toggle('is-on', !!showTag);

      roomRenderer.render(roomScene, roomCamera);
      renderer.render(scene, camera);
    }

    // Render only while visible and in 3D mode.
    function syncLoop() {
      const run = !document.hidden && ui.mode === '3d';
      if (run) { clock.getDelta(); resize(); }
      renderer.setAnimationLoop(run ? frame : null);
    }
    document.addEventListener('visibilitychange', syncLoop);
    addEventListener('desk:mode', () => { setFocus(null); syncLoop(); });

    // Handwriting textures need Caveat; redraw them once it has loaded.
    document.fonts.load('600 50px Caveat').then(() => document.fonts.ready).then(() => {
      noteTex.draw(); sketch.draw(); inner.draw(); coverLabel.draw();
    });

    syncLoop();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      stageEl.classList.add('is-ready');
      backdropEl.classList.add('is-ready');
    }));
  </script>
</body>
</html>
