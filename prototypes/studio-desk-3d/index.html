<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F4F6">
  <meta name="description" content="A technique study of a procedural 3D desk: smooth click-to-focus, ambient idle motion, and a lamp that turns the room to evening.">
  <meta name="robots" content="noindex, nofollow">
  <title>A Quiet Desk — 3D technique study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    // Same probe as the source: can this device draw the desk at a usable speed? Software-only WebGL gets the static desk.
    (function () {
      var gl = false;
      try {
        var canvas = document.createElement('canvas');
        var opts = { failIfMajorPerformanceCaveat: true };
        var ctx = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts);
        if (ctx) {
          gl = true;
          var lose = ctx.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        }
      } catch (e) {}
      window.__deskGL = gl;
    })();
  </script>

  <style>
    :root {
      --accent: #683FCF;
      --ink: #1A1A1A;
      --ink-2: #6B6B6B;
      --ink-3: #9A9A9A;
      --font: 'Inter', system-ui, sans-serif;
      --hand: 'Caveat', cursive;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: #F4F4F6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .room {
      position: relative;
      height: 100vh;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      isolation: isolate;
    }
    .bg { position: absolute; inset: 0; z-index: -1; transition: opacity .9s var(--ease); }
    .bg-day { background: radial-gradient(120% 90% at 50% 45%, #FFFFFF 0%, #F4F4F6 55%, #E8E8EC 100%); }
    .bg-evening {
      background: radial-gradient(75% 65% at 40% 55%, #6B5442 0%, #47392F 36%, #2E2620 70%, #221C18 100%);
      opacity: 0;
    }
    .is-evening .bg-evening { opacity: 1; }

    #stage {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.1s var(--ease);
      touch-action: manipulation;
    }
    #stage.is-ready { opacity: 1; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    .intro {
      position: absolute;
      inset: 0 0 auto;
      padding: calc(2.75rem + env(safe-area-inset-top)) 24px 0;
      text-align: center;
      pointer-events: none;
      transition: opacity .5s var(--ease), transform .6s var(--ease);
    }
    .intro h1 {
      margin: 0;
      font-size: clamp(36px, 4.4vw, 64px);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.03em;
      transition: color .7s;
    }
    .intro p {
      max-width: 34rem;
      margin: 12px auto 0;
      font-size: clamp(15px, 1.25vw, 18px);
      line-height: 1.5;
      color: var(--ink-2);
      transition: color .7s;
    }
    .is-evening .intro h1 { color: #F3E9DA; }
    .is-evening .intro p { color: #CDBBA5; }
    .is-focused .intro { opacity: 0; transform: translateY(-10px); }

    /* Hover tag that follows the object under the pointer */
    .tag {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 3;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(0, 0, 0, .08);
      box-shadow: 0 2px 20px rgba(0, 0, 0, .06);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 10px));
      opacity: 0;
      transition: opacity .18s;
    }
    .tag.is-on { opacity: 1; }
    .tag span { color: var(--ink-3); font-weight: 400; }
    .is-evening .tag { background: rgba(40, 33, 28, .9); border-color: rgba(255, 240, 220, .12); color: #F3E9DA; }
    .is-evening .tag span { color: #B9A792; }

    /* Caption shown while an object is focused */
    .caption {
      position: absolute;
      left: 24px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 4;
      width: min(340px, calc(100% - 48px));
      padding: 16px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(0, 0, 0, .08);
      box-shadow: 0 2px 20px rgba(0, 0, 0, .06);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .35s var(--ease), transform .45s var(--ease);
    }
    .caption.is-on { opacity: 1; transform: none; pointer-events: auto; }
    .caption .eyebrow { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); }
    .caption h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .caption p.body { margin: 6px 0 14px; font-size: 13px; line-height: 1.5; color: #5C6370; }
    .is-evening .caption { background: rgba(40, 33, 28, .92); border-color: rgba(255, 240, 220, .12); color: #F3E9DA; }
    .is-evening .caption p.body { color: #CDBBA5; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, .1);
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .pill:hover { border-color: rgba(0, 0, 0, .2); }
    .is-evening .pill { background: #3A2F27; border-color: rgba(255, 240, 220, .14); color: #F3E9DA; }

    .mode {
      position: absolute;
      right: 24px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      border: 1px solid rgba(0, 0, 0, .08);
      backdrop-filter: blur(8px);
    }
    .mode button {
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
    }
    .mode button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .1); }
    .mode button:disabled { opacity: .4; cursor: not-allowed; }
    .is-evening .mode { background: rgba(40, 33, 28, .7); border-color: rgba(255, 240, 220, .12); }
    .is-evening .mode button { color: #B9A792; }
    .is-evening .mode button[aria-pressed="true"] { background: #4A3D33; color: #F3E9DA; }
    .is-focused .mode { opacity: 0; pointer-events: none; }
    .mode { transition: opacity .3s; }

    .credit {
      position: absolute;
      left: 24px;
      bottom: calc(30px + env(safe-area-inset-bottom));
      margin: 0;
      font-size: 12px;
      color: var(--ink-3);
      transition: opacity .3s, color .7s;
    }
    .is-evening .credit { color: #9C8A76; }
    .is-focused .credit { opacity: 0; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .sr-only:focus-within {
      width: auto; height: auto;
      clip: auto;
      top: 16px; left: 16px;
      z-index: 10;
      display: flex; gap: 6px; flex-wrap: wrap;
    }

    /* ---------- Static desk: an illustration with its own ambient motion ---------- */
    .static {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 150px 16px 70px;
    }
    .static svg { width: min(980px, 100%); height: auto; max-height: 100%; overflow: visible; }
    .s-float { animation: s-float 7s ease-in-out infinite; transform-box: view-box; }
    .s-sway { animation: s-sway 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .s-steam path { animation: s-steam 3.6s ease-in infinite; opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
    .s-steam path:nth-child(2) { animation-delay: 1.2s; }
    .s-steam path:nth-child(3) { animation-delay: 2.4s; }
    .s-cursor { animation: s-cursor 9s var(--ease) infinite; }
    .s-select { animation: s-select 9s steps(1) infinite; transform-box: fill-box; transform-origin: 0 0; }
    .s-night { opacity: 0; transition: opacity .9s var(--ease); }
    .is-evening .s-night { opacity: 1; }
    .s-glow { animation: s-glow 4s ease-in-out infinite; }
    .s-bulb { fill: #E9E4DA; transition: fill .6s; }
    .is-evening .s-bulb { fill: #FFE3AE; }
    .s-lamp-hit { cursor: pointer; }
    .s-lamp-hit:hover ~ .s-lamp .s-shade, .s-lamp-hit:focus-visible ~ .s-lamp .s-shade { fill: #3A3B3F; }
    .s-steam path { stroke: #B9B2A8; }
    .is-evening .s-steam path { stroke: #E8DCCB; }
    .s-shadow { fill: #000; opacity: .1; }
    .is-evening .s-shadow { opacity: .3; }

    @keyframes s-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes s-sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes s-steam {
      0% { opacity: 0; transform: translateY(6px) scaleY(.7); }
      30% { opacity: .55; }
      100% { opacity: 0; transform: translateY(-26px) scaleY(1.15); }
    }
    @keyframes s-cursor {
      0%, 8% { transform: translate(0, 0); }
      22%, 40% { transform: translate(58px, -25px); }
      55%, 73% { transform: translate(58px, 17px); }
      88%, 100% { transform: translate(0, 0); }
    }
    @keyframes s-select {
      0% { transform: translate(0, 0); }
      22% { transform: translate(62px, 0) scale(.857, .46); }
      55% { transform: translate(62px, 40px) scale(.857, .46); }
      88% { transform: translate(0, 0); }
    }
    @keyframes s-glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

    @media (max-width: 640px) {
      .intro { padding-top: calc(2rem + env(safe-area-inset-top)); }
      .caption { left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: calc(100% - 32px); }
      .mode { right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); }
      .credit { display: none; }
      .static { padding: 140px 0 60px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .s-float, .s-sway, .s-steam path, .s-cursor, .s-select, .s-glow { animation: none; }
      .s-steam path { opacity: .35; }
      .intro, .caption, .bg, #stage { transition-duration: .01s; }
    }
  </style>
</head>
<body>
  <main id="room" class="room" data-mode="3d">
    <div class="bg bg-day" aria-hidden="true"></div>
    <div class="bg bg-evening" aria-hidden="true"></div>

    <div id="stage" aria-label="A 3D desk with a laptop, sketchbook, mug, lamp and a plant" role="img"></div>

    <!-- Static desk: shown without WebGL, with ?static, or from the toggle -->
    <div id="static" class="static" hidden>

        <ellipse class="s-shadow" cx="450" cy="520" rx="370" ry="20" filter="url(#s-blur)" />

              <path d="M652 262 C640 240 630 222 618 214 C628 232 636 248 646 262 Z" fill="#5C7E58" />
              <path d="M652 262 C664 240 676 224 690 218 C680 236 668 250 658 262 Z" fill="#6A8D64" />
              <path d="M650 262 C646 236 646 214 652 196 C656 216 658 238 656 262 Z" fill="#7A9E73" />
              <path d="M648 262 C632 252 616 248 602 250 C618 256 632 260 644 264 Z" fill="#4F7050" />
              <path d="M656 262 C672 252 690 250 704 254 C688 258 672 262 660 265 Z" fill="#577954" />
              <path d="M650 262 C640 246 634 232 636 218 C642 234 648 246 654 262 Z" fill="#87A97F" />
              <path d="M654 262 C662 244 670 232 680 226 C672 242 664 252 658 263 Z" fill="#84A67D" />
            </g>
          </g>

          <!-- laptop -->
          <g>
            <ellipse cx="446" cy="396" rx="140" ry="10" fill="#000" opacity=".1" />

            <path d="M330 350 H560 L572 392 H318 Z" fill="#D3D5D9" />

    </div>

    <header class="intro">
      <h1>A quiet desk.</h1>
      <p>Everything on it is drawn in code, except the plant. Click around, and try the lamp.</p>
    </header>

    <div id="tag" class="tag" aria-hidden="true"></div>

    <aside id="caption" class="caption" aria-live="polite" inert>
      <p class="eyebrow"></p>
      <h2></h2>
      <p class="body"></p>
      <button id="back" class="pill" type="button">← Back to the desk</button>
    </aside>

    <p class="credit">Technique study · after pradiplabs.dev</p>

    <div class="mode" role="group" aria-label="View">
      <button type="button" data-mode="3d" aria-pressed="true">3D</button>
      <button type="button" data-mode="static" aria-pressed="false">Static</button>
    </div>

    <div id="a11y" class="sr-only" role="group" aria-label="Desk objects">
      <button class="pill" type="button" data-item="laptop">Look at the laptop</button>
      <button class="pill" type="button" data-item="sketchbook">Open the sketchbook</button>
      <button class="pill" type="button" data-item="mug">Look at the mug</button>
      <button class="pill" type="button" data-item="plant">Look at the plant</button>
      <button class="pill" type="button" data-item="lamp">Toggle the lamp</button>
      <button class="pill" type="button" data-item="note">Peel the sticky note</button>
    </div>
  </main>

  <script>
    // Room state that both the 3D desk and the static desk share: evening (lamp on) and the view mode.
    (function () {
      var room = document.getElementById('room');
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      var LAMP_KEY = 'studio-desk:lamp';

      var hour = new Date().getHours();
      var evening = hour < 7 || hour >= 19;
      try {
        var saved = JSON.parse(localStorage.getItem(LAMP_KEY) || 'null');
        if (saved && Date.now() < saved.until) evening = saved.evening;
      } catch (e) {}

      var canDraw3D = window.__deskGL !== false;
      var mode = !canDraw3D || new URLSearchParams(location.search).has('static') ? 'static' : '3d';

      function applyEvening() {
        room.classList.toggle('is-evening', evening);
        themeMeta.content = evening ? '#2E2620' : '#F4F4F6';
      }
      function applyMode() {
        room.dataset.mode = mode;
        document.getElementById('static').hidden = mode !== 'static';
        document.getElementById('stage').hidden = mode !== '3d';
        document.getElementById('a11y').hidden = mode !== '3d';
        document.querySelectorAll('.mode button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
          if (b.dataset.mode === '3d' && !canDraw3D) {
            b.disabled = true;
            b.title = 'This browser can’t draw the 3D desk';
          }
        });
      }

      window.DeskUI = {
        get evening() { return evening; },
        get mode() { return mode; },
        setEvening: function (value) {
          evening = value;
          applyEvening();

      applyEvening();

    const screenTex = canvasTexture(1024, 640, drawScreen);

      const s = noteState;
      const fast = reduceMotion ? 0.01 : 1;
      if (s.phase === 'stuck') s.curl.step(0, 0.15 * fast, dt);
      if (s.phase === 'peeling') {
        s.curl.step(1, 0.16 * fast, dt);
        if (s.curl.value > 0.82) {
          rig.attach(note);
          s.from.p.copy(note.position);
          s.from.q.copy(note.quaternion);
          s.t = 0;
          s.phase = 'falling';
        }
      }
      if (s.phase === 'falling') {
        s.t = Math.min(1, s.t + dt / (reduceMotion ? 0.05 : 0.95));
        const e = easeOutCubic(s.t);
        note.position.lerpVectors(s.from.p, s.deskSpot.p, e);
        note.position.y += Math.sin(Math.PI * s.t) * 0.03;
        note.position.x += Math.sin(s.t * Math.PI * 2) * 0.012 * (1 - s.t);
        note.quaternion.slerpQuaternions(s.from.q, s.deskSpot.q, easeInOutCubic(s.t));
        s.curl.step(0.14, 0.4, dt);
        if (s.t >= 1) s.phase = 'down';
      }
      if (s.phase === 'down') s.curl.step(0.14, 0.4, dt);
      if (s.phase === 'resticking') {
        s.t = Math.min(1, s.t + dt / (reduceMotion ? 0.05 : 0.7));
        const e = easeInOutCubic(s.t);
        slotInRig(_v, _q);
        note.position.lerpVectors(s.from.p, _v, e);
        note.position.y += Math.sin(Math.PI * s.t) * 0.04;
        note.quaternion.slerpQuaternions(s.from.q, _q, e);
        s.curl.step(0.5 * (1 - e), 0.2, dt);
        if (s.t >= 1) {
          noteSlot.attach(note);
          note.position.set(0, 0, 0);
          note.quaternion.identity();
          s.phase = 'stuck';
        }
      }
      setNoteCurl(s.curl.value);

      _dir.normalize();
      const dist = Math.max(f.dist, (f.size / 2) / tanH * 1.1);
      out.pos.copy(out.target).addScaledVector(_dir, dist);

    function pick(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();

        captionEl.querySelector('.body').textContent = cap.body;

    }

      if (!it) { if (focused) setFocus(null); return; }
      if (it.onClick) it.onClick();
      if (it.focus) setFocus(it);

    let down = null;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
      pointer.inside = true;
      if (canHover && e.pointerType === 'mouse') hovered = pick(e.clientX, e.clientY);
    });
    renderer.domElement.addEventListener('pointerleave', () => { pointer.inside = false; hovered = null; });
    renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
      down = null;

    document.getElementById('back').addEventListener('click', () => setFocus(null));
    addEventListener('keydown', (e) => { if (e.key === 'Escape' && focused) setFocus(null); });
    document.querySelectorAll('#a11y [data-item]').forEach((b) => {
      b.addEventListener('click', () => activate(items.get(b.dataset.item)));
    });

    // ---------------------------------------------------------------------------------------------
    // Frame loop
    // ---------------------------------------------------------------------------------------------
    const clock = new THREE.Clock();
    const night = new Damp1(ui.evening ? 1 : 0);
    let elapsed = 0;
    let screenClock = 0;
    const _proj = new THREE.Vector3();
    const _right = new THREE.Vector3(), _up = new THREE.Vector3();

    function frame() {
      const dt = Math.min(clock.getDelta(), 1 / 30);
      elapsed += dt;
      const t = elapsed;
      const still = reduceMotion;

      // Ambient: the whole desk breathes (drei <Float>-style), very small amplitudes.
      const amp = still ? 0 : 1;
      rig.position.y = Math.sin(t * 0.5) * 0.004 * amp;
      rig.rotation.y = Math.sin(t * 0.33) * 0.012 * amp;
      rig.rotation.x = Math.sin(t * 0.27 + 1) * 0.005 * amp;

      // Evening
      const n = night.step(ui.evening ? 1 : 0, still ? 0.01 : 0.35, dt);
      const flicker = 1 + (still ? 0 : Math.sin(t * 13) * 0.006 + Math.sin(t * 31.7) * 0.004);
      key.intensity = lerp(2.4, 0.16, n);
      key.color.lerpColors(dayKeyColor, nightKeyColor, n);
      hemi.intensity = lerp(0.7, 0.1, n);
      scene.environmentIntensity = lerp(0.9, 0.1, n);
      spot.intensity = lerp(0, 0.75, n) * flicker;
      glow.intensity = lerp(0, 0.12, n) * flicker;
      bulbMat.emissiveIntensity = lerp(0, 4, n);
      blobMat.opacity = lerp(0.45, 0.75, n);
      renderer.toneMappingExposure = lerp(1, 1.12, n);

      // Hover lift
      items.forEach((it) => {
        if (it.noLift) return;
        const lift = it.lift.step(it === hovered && it !== focused ? 0.015 : 0, still ? 0.01 : 0.12, dt);
        it.group.position.y = it.baseY + lift;
      });

      // Item-specific motion
      head.rotation.z = -1.0 + lampNod.step(dt) * 0.5;
      lampSwitch.position.y = 0.0155 + Math.min(0, switchPress.step(dt)) * 0.2;
      plantSway.rotation.z = (still ? 0 : Math.sin(t * 0.8) * 0.012) + plantWobble.step(dt) * 0.6;
      plantSway.rotation.x = (still ? 0 : Math.sin(t * 0.63 + 2) * 0.008) + plantWobble.x * 0.25;
      coverPivot.rotation.z = bookOpen.step(focused === bookItem ? Math.PI + 0.085 : 0, still ? 0.01 : 0.45, dt);
      bookItem.proxy.scale.x = bookOpen.value > 0.5 ? 2 : 1;
      bookItem.proxy.position.x = bookOpen.value > 0.5 ? -BW / 2 : 0;
      updateSteam(t, n);
      updateNote(dt);

      screenClock += dt;
      if (screenClock > 1 / 20) {
        screenClock = 0;
        screenTex.draw((g, w, h) => drawScreen(g, w, h, t));
      }

      // Camera
      if (focused) focusPose(focused, pose); else overviewPose(pose);
      const smooth = still ? 0.01 : 0.42;
      camPos.step(pose.pos, smooth, dt);
      camTarget.step(pose.target, smooth, dt);
      const px = parallax.x.step(pointer.inside && !still ? pointer.x : 0, 0.6, dt);
      const py = parallax.y.step(pointer.inside && !still ? pointer.y : 0, 0.6, dt);
      const pAmp = focused ? 0.012 : 0.06;
      camera.position.copy(camPos.value);
      camera.lookAt(camTarget.value);
      _right.setFromMatrixColumn(camera.matrixWorld, 0);
      _up.setFromMatrixColumn(camera.matrixWorld, 1);
      camera.position.addScaledVector(_right, px * pAmp).addScaledVector(_up, -py * pAmp * 0.5);
      camera.lookAt(camTarget.value);

      // Hover tag + cursor
      const showTag = hovered && hovered !== focused;
      renderer.domElement.style.cursor = hovered ? 'pointer' : (focused ? 'zoom-out' : 'default');
      if (showTag) {
        hovered.labelAnchor.getWorldPosition(_proj).project(camera);
        const [title, hint] = hovered.label();
        const html = `${title} <span>· ${hint}</span>`;
        if (tagEl.innerHTML !== html) tagEl.innerHTML = html;
        tagEl.style.left = `${(_proj.x * 0.5 + 0.5) * stageEl.clientWidth}px`;
        tagEl.style.top = `${(-_proj.y * 0.5 + 0.5) * stageEl.clientHeight}px`;
      }
      tagEl.classList.toggle('is-on', !!showTag);

      renderer.render(scene, camera);
    }

    // Render only while visible and in 3D mode.
    function syncLoop() {
      const run = !document.hidden && ui.mode === '3d';
      if (run) { clock.getDelta(); resize(); }
      renderer.setAnimationLoop(run ? frame : null);
    }
    document.addEventListener('visibilitychange', syncLoop);
    addEventListener('desk:mode', () => { setFocus(null); syncLoop(); });

    // Handwriting textures need Caveat; redraw them once it has loaded.
    document.fonts.load('600 50px Caveat').then(() => document.fonts.ready).then(() => {
      noteTex.draw(); sketch.draw(); inner.draw(); coverLabel.draw();
    });

    syncLoop();
    requestAnimationFrame(() => requestAnimationFrame(() => stageEl.classList.add('is-ready')));
  </script>
</body>
</html>
