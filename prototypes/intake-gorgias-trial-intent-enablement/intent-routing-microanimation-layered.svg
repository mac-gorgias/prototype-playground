<svg width="760" height="276" viewBox="0 0 760 276" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">How AI Agent handles incoming tickets</title>
  <desc id="description">Three shopper questions are classified by intent, then answered with a matching skill or handed over to the support team.</desc>
  <metadata id="framer-motion-map"><![CDATA[
    LOOP_DURATION: 12s
    SEQUENCE_1: question-order > connector-incoming-dot > intent-order-status > connector-response-dot > outcome-response
    SEQUENCE_2: question-return > connector-incoming-dot > intent-return-request > connector-handover-dot > outcome-handover
    SEQUENCE_3: question-shipping > connector-incoming-dot > intent-international-shipping > connector-response-dot > outcome-response
    MOTION: All dots travel left to right. Reset each dot to its origin only while opacity is 0.
  ]]></metadata>
  <defs>
    <filter id="card-shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E242E" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .body { fill: #1e242e; font-size: 13px; font-weight: 500; }
      .title { font-size: 13px; font-weight: 650; }
      .detail { fill: #1e242e; font-size: 10px; font-weight: 600; }
      .support { fill: #6b7280; font-size: 10px; font-weight: 400; }
      .caption { fill: #5c6370; font-size: 11px; font-weight: 400; }
      .stroke { vector-effect: non-scaling-stroke; }
    </style>
  </defs>

  <g id="microanimation-background" data-framer-name="Microanimation background">
    <rect x="1" y="1" width="758" height="274" rx="8" fill="#ffffff" stroke="#e8e8e5"/>
  </g>

  <g id="questions" data-framer-name="Questions">
    <g id="question-order" data-framer-name="Question / Order status">
      <rect id="question-order-card" x="18" y="24" width="160" height="44" rx="7" fill="#f4f0ff" stroke="#9f82f7" filter="url(#card-shadow)"/>
      <text x="30" y="51" class="body" fill="#5c3cc4">Where is my order?</text>
    </g>
    <g id="question-return" data-framer-name="Question / Return request">
      <rect id="question-return-card" x="18" y="78" width="160" height="44" rx="7" fill="#ffffff" stroke="#e5e7eb" filter="url(#card-shadow)"/>
      <text x="30" y="105" class="body">Can I return this?</text>
    </g>
    <g id="question-shipping" data-framer-name="Question / International shipping">
      <rect id="question-shipping-card" x="18" y="132" width="160" height="44" rx="7" fill="#ffffff" stroke="#e5e7eb" filter="url(#card-shadow)"/>
      <text x="30" y="159" class="body">Do you ship to Canada?</text>
    </g>
  </g>

  <g id="connector-incoming" data-framer-name="Connector / Question to intent">
    <path id="connector-incoming-line" d="M186 100H220" stroke="#e4e0ec" stroke-width="1.4" class="stroke"/>
    <circle id="connector-incoming-dot" data-framer-name="Motion dot / Incoming" cx="186" cy="100" r="4.5" fill="#7e55f6" stroke="#ffffff" stroke-width="2" opacity="0" class="stroke"/>
  </g>

  <g id="ai-agent" data-framer-name="AI Agent intent detection">
    <rect id="ai-agent-card" x="220" y="22" width="160" height="158" rx="10" fill="#f8f6fe" stroke="#c7b8f5"/>
    <g id="ai-agent-icon" data-framer-name="AI Agent icon">
      <rect x="276" y="44" width="48" height="48" rx="12" fill="#ede8f8"/>
      <image x="288" y="56" width="24" height="24" href="data:image/svg+xml;base64,"/>
    </g>
    <g id="intents" data-framer-name="Intent labels">
      <g id="intent-order-status" data-framer-name="Intent / Order status">
        <text x="300" y="126" text-anchor="middle" fill="#5c3cc4" font-size="12" font-weight="600">Intent: order status</text>
      </g>
      <g id="intent-return-request" data-framer-name="Intent / Return request" opacity="0">
        <text x="300" y="126" text-anchor="middle" fill="#5c3cc4" font-size="12" font-weight="600">Intent: return request</text>
      </g>
      <g id="intent-international-shipping" data-framer-name="Intent / International shipping" opacity="0">
        <text x="300" y="126" text-anchor="middle" fill="#5c3cc4" font-size="12" font-weight="600">Intent: international shipping</text>
      </g>
    </g>
  </g>

  <g id="connector-outcomes" data-framer-name="Connector / Intent to outcomes">
    <path id="connector-outcomes-trunk" d="M380 100H392" stroke="#b9aedf" stroke-width="1.4" class="stroke"/>
    <path id="connector-response-line" d="M392 100C400 100 400 64 408 64H430" stroke="#76b9a2" stroke-width="1.4" class="stroke"/>
    <path id="connector-handover-line" d="M392 100C400 100 400 140 408 140H430" stroke="#a98cf8" stroke-width="1.4" class="stroke"/>
    <circle id="connector-response-dot" data-framer-name="Motion dot / Response" cx="380" cy="100" r="4.5" fill="#147656" stroke="#ffffff" stroke-width="2" opacity="0" class="stroke"/>
    <circle id="connector-handover-dot" data-framer-name="Motion dot / Handover" cx="380" cy="100" r="4.5" fill="#7e55f6" stroke="#ffffff" stroke-width="2" opacity="0" class="stroke"/>
  </g>

  <g id="outcomes" data-framer-name="Outcomes">
    <g id="outcome-response" data-framer-name="Outcome / Response">
      <rect id="outcome-response-card" x="430" y="28" width="312" height="72" rx="7" fill="#f8fbfa" stroke="#b8d8cd" filter="url(#card-shadow)"/>
      <g id="outcome-response-icon" data-framer-name="Icon / Check circle" stroke="#147656" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" class="stroke">
        <circle cx="452" cy="64" r="7"/>
        <path d="M448.8 64.2L450.8 66.2L455.2 61.8"/>
      </g>
      <g id="outcome-response-copy" data-framer-name="Copy / Response">
        <text x="470" y="51" class="title" fill="#147656">Response</text>
        <text x="470" y="67" class="detail">When a skill matches the intent</text>
        <text x="470" y="82" class="support">AI Agent handles the conversation</text>
      </g>
    </g>
    <g id="outcome-handover" data-framer-name="Outcome / Handover">
      <rect id="outcome-handover-card" x="430" y="108" width="312" height="72" rx="7" fill="#fbfaff" stroke="#d2c7f5" filter="url(#card-shadow)"/>
      <g id="outcome-handover-icon" data-framer-name="Icon / Team" stroke="#5c3cc4" stroke-width="1.3" stroke-linecap="round" class="stroke">
        <circle cx="449.5" cy="137" r="2.2"/>
        <path d="M445.5 144C446 142 447.4 141 449.5 141C451.6 141 453 142 453.5 144M454 135.5C455.3 136.3 455.3 138.2 454 139.2M454.5 141C456.2 141.3 457.3 142.3 457.7 144"/>
      </g>
      <g id="outcome-handover-copy" data-framer-name="Copy / Handover">
        <text x="470" y="131" class="title" fill="#5c3cc4">Handover</text>
        <text x="470" y="147" class="detail">When AI Agent can't answer</text>
        <text x="470" y="162" fill="#6b5a9e" font-size="10">Your team takes over</text>
      </g>
    </g>
  </g>

  <g id="captions" data-framer-name="Captions">
    <path id="caption-divider" d="M18 204H742" stroke="#e8e8e5" class="stroke"/>
    <text id="caption-question" data-framer-name="Caption / Question" x="98" y="222" text-anchor="middle" class="caption">Your customer submits a ticket.</text>
    <g id="caption-intent" data-framer-name="Caption / Intent" text-anchor="middle" class="caption">
      <text x="300" y="222">AI Agent determines</text>
      <text x="300" y="237">the customer's intent.</text>
    </g>
    <g id="caption-outcome" data-framer-name="Caption / Outcome" text-anchor="middle" class="caption">
      <text x="586" y="222">AI Agent responds using</text>
      <text x="586" y="237">a matching skill or hands the ticket</text>
      <text x="586" y="252">over to your team.</text>
    </g>
  </g>
</svg>
